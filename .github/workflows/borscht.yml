# borscht: Rust checks + Python typecheck and test suite.
name: borscht

on:
  push:
    branches: [master]
    paths:
      - 'borscht/**'
      - '.github/workflows/borscht.yml'
  pull_request:
    paths:
      - 'borscht/**'
      - '.github/workflows/borscht.yml'
  workflow_dispatch:
  workflow_call: # release.yml calls this as the gate before publishing

permissions:
  contents: read

defaults:
  run:
    working-directory: borscht

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # uv builds borscht's Rust extension through maturin, so it needs cargo.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: borscht
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked: fail if uv.lock is out of date with pyproject.toml.
      # --no-dev --with ...: skip the dev group's torch, whose linux wheel
      #   pulls in several GB of nvidia-* deps that no test imports yet. Once the
      #   tests use torch as an oracle, drop these flags and point torch at
      #   the CPU index (https://download.pytorch.org/whl/cpu) in [tool.uv.sources].
      # pyrefly needs pytest too: project-includes covers python/tests, which import it.
      # pyrefly's version is read from uv.lock (via uv export), so CI runs the same
      #   pyrefly as `uv run pyrefly check` locally. grep fails the step if it's missing.
      - name: pyrefly
        run: |
          pyrefly=$(uv export --locked --only-group dev --no-hashes --no-annotate --no-header -q | grep '^pyrefly==')
          uv run --locked --no-dev --with "$pyrefly" --with pytest pyrefly check
      - name: pytest
        run: uv run --locked --no-dev --with pytest pytest -v
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: borscht
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
