# Welcome to the teaching deep learning framework borscht, a hackable subset of pytorch.
# We continue the hacker's spirit that lives in teaching systems such as
# MIT's teaching operating system xv6[0], Cornell's educational compiler IR bril[1], and Berkeley's educational core sodor[2]

# borscht's source is heavily commented following Knuth's philosophy of literate programming[3].
# "Let us change our traditional attitude to the construction of programs:
#  Instead of imagining that our main task is to instruct a computer what to do,
#  let us concentrate rather on explaining to human beings what we want a computer to do."

# There is a specific order we recommend the reader to walkthrough the codebase.
# In fact, this is the order of how borscht's companion textbook The Structure and Interpretation of Tensor Programs[4] presents borscht
# — Here, in the pyproject.toml, we briefly explain how borscht's mixed source of Python, Rust, and CUDA all cohere together
#   so that the user's can happily chop tensors, and carry weights with a single line of import borscht
#   After reading this file, the second file you should read is Cargo.toml

# You are highly encouraged to modify, extend, and hack on borscht.
# Once you feel comfortable, we highly encourage you to graduate onto industry-level deep learning systems such as torch and vllm.
# See you at work.

