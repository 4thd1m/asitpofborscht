# Now that the borscht package is *organized* as a package with a module system, we'd like to *distribute* said package.
# Rather than zipping and hosting the files for end-users to manually download,
# we'd like to deploy the borscht package to Python's default package index pypi.org
# so that borscht is distributed to end-users with a `pip install borscht` or `uv add borscht`
# see: https://packaging.python.org/en/latest/glossary/#term-Package-Index

# This is done with a *project*, which we define with a pyproject.toml
# Below we interweave the project's source tree with the command line tool tree and the project's specification
# see: https://packaging.python.org/en/latest/glossary/#term-Project
# see: https://packaging.python.org/en/latest/glossary/#term-Project-Source-Tree
# see: https://packaging.python.org/en/latest/glossary/#term-Pyproject-Metadata

# asitpofborscht/borscht $ tree -L 4
# ├── borscht <------------------------------------------ the project directory, which although can be arbitraily named, it's convention to name after the package
# │   ├── pyproject.toml <------------------------------- the tool agnostic manifest file for the project
[project]                                                 # In order to deploy the borscht package, we define a *project* via this tool-agnostic pyproject.toml manifest
name = "borscht"                                          # it's delicious! the field is configured to borscht, so end users can install with pip install borscht or uv add borscht
requires-python = ">=3.15"                                # released October 9th 2026                                                                                             |
dynamic = ["version"]                                     # we configure which keys were intentionally unspecified (version) and will be dynamically populated at build time      |
                                                          #                                                                                                                       |
                                                          #                                                                                                                       |
                                                          #                                                                                                                       |
# │   ├── python <--------------------------------------- the source directory of the project (conventially named src/), which can include many packages. we only have..          |
# │   │   ├── borscht <---------------------------------- the borscht package, where end users import in their source with import borscht ----------------------------------------+
# │   │   │   ├── __init__.py <-------------------------- the borscht package's modules are initialized                                    to differentiate between the package manager's installation
# │   │   │   ├── _borscht.cpython-315-darwin.so <------- extension module (note the .so file name)                                        and the source code import, the former is referred to as the
# │   │   │   ├── _borscht.pyi                                                                                                             distribution package and the latter as the import package
# │   │   │   ├── compile.py <--------------------------- pure module (plain old .py)                                                      a project is often synonymous with it's distribution package
# │   │   │   ├── engine.py                                                                                                                see: https://packaging.python.org/en/latest/discussions/distribution-package-vs-import-package/
# │   │   │   ├── func.py
# │   │   │   ├── kernels
# │   │   │   ├── linalg.py
# │   │   │   ├── nn.py
# │   │   │   ├── ops.py
# │   │   │   ├── optim.py                                
# │   │   │   ├── py.typed
# │   │   │   ├── tensor_managed.py <-------------------- When you run tensor_managed.py file as a script with uv run tensor_managed.pyh
# │   │   │   ├── tensor_nativecpu.py                     the _gemm(a,b,n,k,m) routine is imported from the _borscht.cpython-315-darwin.so extension module
# │   │   │   ├── tensor_nativegpu.py                     and executed *directly* on the physical machine
# │   │   │   └── tensor.py                               How does this work? ----------------------------------------------------------------------------+
# │   │   └── tests                                       -> Enter the CPython API                                                                        |
# │   │       ├── __pycache__                                                                                                                             |
# │   │       └── test_tensor_managed.py                                                                                                                  |
# │   ├── rust                                                                                                                                            |
# │   │   ├── ...                                                                                                                                         |
                                  #                                                                                                                       |
[build-system]                    #                                                                                                                       |
requires = ["maturin>=1.14,<2.0"] # maturin is our build backend that compiles native rust source into cpython extension modules via pyo3                 |
build-backend = "maturin"         # see: https://docs.python.org/3/tutorial/modules.html                                                                  |
                                  # see: https://pyo3.rs/v0.30.1/ and http://maturin.rs/                                                                  |
                                  # see Cargo.toml for the native's configuration manifest                                                                |
                                  #                                                                                                                       |
[tool.maturin]                    # maturin supports multiple python/rust project layouts depending on the use-case                                       |
python-source = "python"          # we configure python-source because we are not simply wrapping a 100% rust source with python                          |
module-name = "borscht._borscht"  # we configure module-name, importing rust source as a submodule -------------------------------------------------------+
exclude = [                       # see: https://www.maturin.rs/project_layout.html#mixed-rustpython-project
    "**/__pycache__",             # see: https://www.maturin.rs/project_layout.html#import-rust-as-a-submodule-of-your-project
    "**/*.pyc",
    "**/*.pyo"
]

[tool.uv]                                                                                      # we configure uv's cache-keys manually, so that for development and testing with editable install of borscht,
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "rust/**/*.rs" }] # uv will rebuild cpython extension modules automatically since [build-system] is configured with maturin
                                                                                               # this avoids manually re-compling the native extension module with `maturin develop` anytime the rust source is modified
                                                                                               # see: https://docs.astral.sh/uv/concepts/cache/#dynamic-metadata
extra-build-variables = { borscht = { CARGO = ".cargo/maturin-cargo" } }                       # we configure the cargo that maturin runs to be .cargo/maturin-cargo, which compiles through `cargo oxide build`,
                                                                                               # so that the #[kernel]s in rust/kernelsgpu.rs are compiled to PTX and embedded in the extension module (see that file)
                                                                                               # see: https://docs.astral.sh/uv/reference/settings/#extra-build-variables










# All programming languages are domain-specific languages in some sense, and Python was no exception to the rule.
# Python started out as a "scripting" language primarily meant for "glue" code.
# One of the primary use cases you want for a scripting language (often implemented by an interpreter) is to be able to
#   1. extend the interpreter with accelerated code for performance critical areas
#   2. embed the interpreter into native code

    # 1. Extending the Interpreter
    # The first use case of extending the interpreter is effectively all deep learning frameworks (a Python veneer over natively-accelerated code),
    # but was even true for the CPython implementation long before any deep learning frameworks entered the scene.
    # For instance, a lot of CPython's stdlib implementation is in pure Python (for the usual self-hosted reasons),
    # but the mission critical modules such as json, pickle, and decimal are implemented in C/C++.
    # This is because, depending on the workload, native code is generally 10x, 20x, 50x times faster than it's virtual counterpart.
    # Of course, for the purposes of numpy, torch, jax and friends, this first use case is the primary one.

    # 2. Embedding the Interpreter
    # The second use case of embedding the interpeter appears when a performance-critical system such as a
    # game engine wants to enable user-authored plugins without the user having to write native code
    # Or perhaps imagine rocket software written in C++ wants astronauts to be able to write scripts more productively in Python.

    # Both the extension and embeding of the CPython interpreter has been possible since the early '90s
    # thanks to what is known as the **C API** https://docs.python.org/3/extending/index.html#guides-for-intermediate-topics
    # Note that is only possible with the *CPython* interpreter. This is *not* a feature of *the* Python language itself
        # Moreover, both use cases of extension and embedding is *different* from simply *calling* C *from* Python.
        # You can do the latter using Python's ctypes or cffi modules in the stdlib,
        # which would better preserve the portability of code across Python implementations[1].

    # There is a tutorial: https://docs.python.org/3/extending/first-extension-module.html#first-extension-module
    #      and a reference manual: https://docs.python.org/3/c-api/index.html#c-api-index

    # We will briefly cover how to manually write a C extension module similar to the tutorial,
    # which can be automated by third-party tools such as pybind/nanobind and pyo3 for C++ and Rust respectively.
    # pytorch and jax in fact use the former, whereas with borscht we will be using the latter.












[dependency-groups]                                 # borscht uses numpy and torch as oracles. see chapter (todo).
dev = [
    "numpy>=2.5.4",
    "pyrefly>=1.4.1",
    "pytest>=9.1.1",
    "torch>=2.15.0; platform_machine != 'riscv64'", # we configure an environment marker to skip torch on risc-v, since pytorch publishes no riscv64 wheels
                                                    # see: https://packaging.python.org/en/latest/specifications/dependency-specifiers/#environment-markers
]

[tool.pyrefly]                                      # configure type checking with pyrefly (`uv run pyrefly check`)
project-includes = ["python"]                       # we configure the files to type check
disable-project-excludes-heuristics = true          # we configure pyrefly to stop excluding site-packages paths, since the editable install of borscht puts python/ itself on the interpreter's site-packages path (see the .pth file in .venv/lib/python3.15/site-packages)
preset = "strict"                                   # we configure the strict preset


[tool.pytest.ini_options]                           # configure testing
testpaths = ["python/tests"]                        # we configure the list of directories that python should search for
                                                    # when no specific directories, files, or test ids are given in the command line
                                                    # we set this to python/tests (maturin does by default),
                                                    # presumably because Cargo uses top-level tests/ for integration
                                                    # see: https://docs.pytest.org/en/stable/reference/reference.html#confval-testpaths