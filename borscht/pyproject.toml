# [0]: See the Mojo programming language (by Chris Lattner of clang, llvm and swift), attempting to replace all three languages with one.
# [1]: Although CPython's is getting a JIT compiler (Sea of Nodes! Thanks Ken Jin), for Python implementations like PyPy for instance

[project]
name = "borscht"      # it's delicious!
requires-python = ">=3.15"
dynamic = ["version"] # we configure which keys were intentionally unspecified
                      # see: https://packaging.python.org/en/latest/specifications/pyproject-toml/#dynamic

                      # we configure version, so that the maturin build backend
                      # automagically fills in at build time *from* Cargo.toml's version field
                      # see: https://www.maturin.rs/metadata.html#dynamic-metadata
                      # see: https://doc.rust-lang.org/cargo/reference/manifest.html#the-version-field

[dependency-groups]   # borscht uses numpy and torch as oracles. see chapter (todo).
dev = [
    "numpy>=2.5.4",
    "pyrefly>=1.4.1",
    "pytest>=9.1.1",
    "torch>=2.15.0",
]

[tool.pyrefly]                              # pyrefly is our static type checker run by the editor and by `uv run pyrefly check`
project-includes = ["python"]              # we configure the files to type check
disable-project-excludes-heuristics = true # we configure pyrefly to stop excluding site-packages paths, since the editable install of borscht puts python/ itself on the interpreter's site-packages path (see the .pth file in .venv/lib/python3.15/site-packages)
preset = "strict"                          # we configure the strict preset


[tool.pytest.ini_options]
testpaths = ["python/tests"] # we configure the list of directories that python should search for
                             # when no specific directories, files, or test ids are given in the command line
                             # we set this to python/tests (maturin does by default),
                             # presumably because Cargo uses top-level tests/ for integration
                             # see: https://docs.pytest.org/en/stable/reference/reference.html#confval-testpaths

[build-system]
requires = ["maturin>=1.14,<2.0"] # maturin is our build backend that compiles native rust source into cpython extension modules via pyo3
build-backend = "maturin"         # see: https://docs.python.org/3/tutorial/modules.html
                                  # see: https://pyo3.rs/v0.30.1/ and http://maturin.rs/
                                  # see Cargo.toml for the native's configuration manifest

[tool.maturin]                    # maturin supports multiple python/rust project layouts depending on the use-case
python-source = "python"          # we configure python-source because we are not simply wrapping a 100% rust source with python
module-name = "borscht._borscht"  # we configure module-name, importing rust source as a submodule
exclude = [                       # see: https://www.maturin.rs/project_layout.html#mixed-rustpython-project
    "**/__pycache__",             # see: https://www.maturin.rs/project_layout.html#import-rust-as-a-submodule-of-your-project
    "**/*.pyc",
    "**/*.pyo"
]

[tool.uv] # we configure uv's cache-keys manually, so that for development and testing with editable install of borscht,
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "rust/**/*.rs" }]
# uv will rebuild cpython extension modules automatically since [build-system] is configured with maturin
# this avoids manually re-compling the native extension module with `maturin develop` anytime the rust source is modified
# see: https://docs.astral.sh/uv/concepts/cache/#dynamic-metadata