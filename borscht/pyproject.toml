# + ============ +
# | Python and C |
# + ============ +

# borscht has a mixed source of Python, Rust, and CUDA, coloquially quipped as "the three language problem"[0].
# Python for productivity, Rust for performance on the CPU, and CUDA for performance on GPU.
# Let us first explain how Python and Rust interop with one another.

# All programming languages are domain-specific languages in some sense, and Python was no exception to the rule.
# Python started out as a "scripting" language primarily meant for "glue" code.
# One of the primary use cases you want for a scripting language (often implemented by an interpreter) is to be able to
# 1. extend the interpreter with accelerated code for performance critical areas
# 2. embed the interpreter into native code

# The first use case of extending the interpreter is effectively all deep learning frameworks (a Python veneer over natively-accelerated code),
# but was even true for the CPython implementation long before any deep learning frameworks entered the scene.
# For instance, a lot of CPython's stdlib implementation is in pure Python (for the usual self-hosted reasons),
# but the mission critical modules such as json, pickle, and decimal are implemented in C/C++.
# This is because, depending on the workload, native code is generally* 10x, 20x, 50x times faster than it's virtual counterpart.
# For sticklers, pay attention to the use of the qualifier in the preceding sentence.
# Of course, for the purposes of numpy, torch, jax and friends, this first use case is the primary one.

# The second use case of embedding the interpeter appears when a performance-critical system such as a
# game engine wants to enable user-authored plugins without the user having to write native code
# Or perhaps imagine rocket software written in C++ wants astronauts to be able to write scripts more productively in Python.

# Both the extension and embeding of the CPython interpreter has been possible since the early '90s thanks to what is known as the C API.
# Note that is only possible with the *CPython* interpreter. This is *not* a feature of *the* Python language itself
# There is a user guide: https://docs.python.org/3/extending/index.html#extending-index
#      and a reference manual: https://docs.python.org/3/c-api/index.html#c-api-index
# Moreover, both use cases of extension and embedding is *different* from simply *calling* C *from* Python.
# You can do the latter using Python's ctypes or cffi modules in the stdlib,
# which would better preserve the portability of code across Python implementations[1].

