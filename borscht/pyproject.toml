#  bmmmd'  After reading File 2. Hello Tensor (tensor_managed.py), you understand the core essence of the Tensor concept and it's primary algorithm of matrix multiplication
#          After reading File 3A. Accelerate Tensor (tensor_nativecpu.py), you understand why deep learning frameworks accelerate their algorithms using native languages that execute on physical machines
