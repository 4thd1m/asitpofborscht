[package]         # a package is a collection of .rs source files and a Cargo.toml manifest file that is distributed in a package registry
                  # we could publish borscht's rust package to the default package registry (crates.io) independently of borscht's python package and pypi.org
                  # one use case could be the frontend for a Tensor library being authored in Julia needing native acceleration
name = "borscht"  # it's rusty! (this is the only the field required) see: https://doc.rust-lang.org/cargo/reference/manifest.html#the-package-section
version = "0.1.0" # the version for *both* the python project and the Rust package
edition = "2024"  # automatically specified with cargo new. Rust editions are a language feature for language evolution i.e Rust's "stability without stagnation"
                  # see: https://doc.rust-lang.org/edition-guide/editions/

# a package has n target(s), where target can be a library, binary, example, test, or benchmark,
#        which corresponds to an artifact for the target machine: linkable library, an executable binary, and generated documentation
# see: https://doc.rust-lang.org/cargo/appendix/glossary.html#package
# see: https://doc.rust-lang.org/cargo/appendix/glossary.html#target
# see: https://doc.rust-lang.org/cargo/appendix/glossary.html#artifact
[lib] # see: https://doc.rust-lang.org/cargo/reference/cargo-targets.html#configuring-a-target
name = "borscht"        # The name of the target. For library targets, the name defaults to the name of the package.
path = "rust/lib.rs"    # The source file of the target.
crate-type = ["cdylib"] # The crate types to generate.
                        # see: https://doc.rust-lang.org/cargo/reference/cargo-targets.html#the-crate-type-field
                        # see: https://doc.rust-lang.org/reference/linkage.html
[dependencies]          
pyo3 = "0.29.0"    # The pyo3 crate, which we will learn more about it in the next file of lib.rs
                   # That is all we need to configure for borscht's native acceleration on CPU (File 3. Accelerate Tensor)
                   # Relatively simple compared to the Python package's pyproject.toml manifest! This is because the Rust package is 
                   # The remainder of dependencies are there for borscht's native  acceleratio non GPU (File 4. Accelerate++Tensor)















