# AmmmmmMMmm db     .AMA.   .AMMA.YMbmd'   YMbmd'   `Mbmmd'.JMML.`Mbmmd'.JMML.  `Moo9^Yo.`Mbmo`Mbmmd'     M         M            .JMML.`Mbmmd'.JMML  JMML.M9mmmP'  `Ybmd9'.JMML.   
#       MM
# **********************************************************************************************************************
#                                               borscht (Literary Source)
# <-- File 3. Accelerate Tensor               -- File 4. Accelerate++ Tensor --          File 5. Abstract Accelerate -->
#             tensor_nativecpu.py                        tensor_nativegpu.py
#             pyproject.toml/Cargo.toml                  Cargo.toml
#             lib.rs/kernelscpu.rs                       kernelsgpu/
#                                                          utils.rs
#                                                          host.rs
#                                                          device.rs
# **********************************************************************************************************************
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust.git", optional = true }
cuda-host = { git = "https://github.com/NVIDIA/cuda-rust.git", optional = true }
# Shared host-side runtime. It has to come from the same repository as
# cuda-host, which depends on it; a crates.io copy is a second cuda-core.
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git", optional = true }

[features]
default = ["cuda"]
cuda = ["dep:cuda-device", "dep:cuda-host", "dep:cuda-core"]
# we configure the cuda dependencies as optional behind a cuda feature (on by default), so that machines with no CUDA
# (macos, riscv64, ...) can still build the CPU half of borscht with --no-default-features.
# lib.rs compiles rust/kernelsgpu/ only #[cfg(feature = "cuda")], and .cargo/maturin-cargo turns the feature off
# whenever cargo-oxide isn't installed, so `uv run` works on those machines without any flags.
# see: https://doc.rust-lang.org/cargo/reference/features.html#optional-dependencies


