[build]
# The sitp toolchain is pinned by aquascope: sitp/vendor/aquascope is a
# submodule, and sitp/rust-toolchain.toml is a symlink into it. Read the
# channel out of that file rather than repeating it here, so bumping the
# submodule is the only edit a toolchain upgrade needs.
command = '''
set -euo pipefail

TOOLCHAIN=$(grep -m1 "^channel" sitp/rust-toolchain.toml 2>/dev/null | cut -d\" -f2) || TOOLCHAIN=""
if [ -z "$TOOLCHAIN" ]; then
  echo "netlify: could not read channel from sitp/rust-toolchain.toml" >&2
  echo "netlify: is the sitp/vendor/aquascope submodule initialized?" >&2
  exit 1
fi
echo "netlify: sitp toolchain is $TOOLCHAIN"

# Bare `rustup toolchain install` installs the active toolchain, which
# inside sitp/ means the channel and components from rust-toolchain.toml.
(cd sitp && rustup toolchain install --no-self-update)

# That install ran under sitp/'s rust-toolchain.toml override, and rustup does
# not set a default when it installs under an override. The image ships without
# one, so a bare `cargo` at the repo root has no toolchain to dispatch to
# ("could not choose a version of cargo to run"). Every cargo call below names
# its toolchain, so none of this depends on a default being configured.
rustup toolchain install --no-self-update stable

# The Rust tools install under TOOLS_HOME, which the sitp-tool-cache plugin
# (netlify/plugins/) restores before this command and saves after a successful
# build. cargo install skips a crate already installed at the same version and
# source, so a cached tool is not recompiled. It does not check rustc, though,
# and aquascope_front links against the pinned nightly's compiler libraries, so
# each toolchain gets its own install root, and roots for any other toolchain
# are deleted so the cache does not keep stale tools.
TOOLS_HOME="$HOME/.sitp-tools"
TOOLS="$TOOLS_HOME/$TOOLCHAIN"
mkdir -p "$TOOLS"
find "$TOOLS_HOME" -mindepth 1 -maxdepth 1 ! -name "$TOOLCHAIN" -exec rm -rf {} +
export PATH="$TOOLS/bin:$PATH"

# The mdbook preprocessors build against stable; only aquascope_front needs the
# rustc-dev nightly that sitp is pinned to.
cargo +stable install --root "$TOOLS" mdbook --version 0.5.2 --locked
cargo +stable install --root "$TOOLS" mdbook-katex --git https://github.com/lzanini/mdbook-katex
cargo +stable install --root "$TOOLS" mdbook-aquascope --locked
cargo +stable install --root "$TOOLS" mdbook-quiz --locked
cargo "+$TOOLCHAIN" install --root "$TOOLS" aquascope_front --git https://github.com/cognitive-engineering-lab/aquascope --tag v0.4.0

curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
export PATH="$HOME/.elan/bin:$PATH"

# Mathlib has thousands of modules, far more than a deploy has time to compile.
# Download its prebuilt .olean files instead, so the `lake build` that
# mdbook-lean runs finds Mathlib up to date and builds only SubVerso and SitpLean.
(cd sitp/lean && lake exe cache get)

cd sitp && mdbook build
'''
publish = "sitp/book"

[[plugins]]
package = "./netlify/plugins/sitp-tool-cache"

# Same-origin passthrough for the doc hover previews in theme/js/custom.js.
# Those previews fetch a doc page and lift out its signature + summary, which
# needs the page to be readable by script. numpy.org sends
# `access-control-allow-origin: *` and is fetched directly; matplotlib.org sends
# no CORS header at all, so the browser refuses to hand its body to script. This
# proxy makes that fetch same-origin, which sidesteps CORS entirely. It carries
# preview fetches only — the links in the book still point at matplotlib.org.
[[redirects]]
from = "/docs-proxy/matplotlib/*"
to = "https://matplotlib.org/:splat"
status = 200
force = true
